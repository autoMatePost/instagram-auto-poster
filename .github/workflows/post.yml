name: Instagram Auto Poster

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"  # 6:00 AM IST
    - cron: "30 1 * * *"  # 7:00 AM IST
    - cron: "30 2 * * *"  # 8:00 AM IST
    - cron: "30 4 * * *"  # 10:00 AM IST
    - cron: "30 6 * * *"  # 12:00 PM IST
    - cron: "30 7 * * *"  # 1:00 PM IST
    - cron: "30 12 * * *" # 6:00 PM IST
    - cron: "30 13 * * *" # 7:00 PM IST
    - cron: "30 14 * * *" # 8:00 PM IST
    - cron: "30 15 * * *" # 9:00 PM IST

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_CAPTION: ${{ secrets.INSTAGRAM_CAPTION }}
          FACT_HERO_ACCESS_TOKEN: ${{ secrets.FACT_HERO_ACCESS_TOKEN }}
          FACT_HERO_USER_ID: ${{ secrets.FACT_HERO_USER_ID }}
        run: |
          python post_to_instagram.py

      - name: Save queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update posting queue"
          git push
